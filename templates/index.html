<!DOCTYPE html>
<html>
<head>
  <title>Smart Parking - Welcome</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0f3d;
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    .button {
      background: rgba(0, 123, 255, 0.7);
      border: none;
      color: white;
      padding: 15px 30px;
      margin: 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 123, 255, 0.7);
      transition: all 0.3s;
    }
    .button:hover {
      background: rgba(0, 123, 255, 1);
    }
  </style>
</head>
<body>
  <h1>Welcome to Smart Parking</h1>
  <p>Please choose an option:</p>
  <a href="/register"><button class="button">Register</button></a>
  <a href="/login"><button class="button">Login</button></a>
</body>
</html>
